// ======= 遊戲狀態 =======
let gameState = {
  birth:{
    gender:"male",
    orientation:"pan",
    familyWealth:"middle",
    birthCountry:"中國香港", // 可見當前國籍，7歲會改
    district:"油尖旺區",
    residenceType:"唐樓",
    residenceName:"大同新邨"
  },
  initialNationality:"", // 【隱藏！永不顯示，永不修改】開局原始國籍
  trait:{
    outgoing:50,
    pragmatic:50,
    empathy:50,
    introvert:50
  },
  stats:{
    studyLevel:"medium",
    finance:"low"
  },
  age:0, // 角色歲數，用於7歲自動轉國籍
  stage:"start",
  eventIndex:0,
  birthLocked: false,
  flags:{}
};

// ======= 加權抽其他國家（rollOtherCountryPool） =======
function rollOtherCountryPool(){
  let totalWeight = 0;
  for(let c of otherCountryWeightList){
    totalWeight += c.weight;
  }
  let r = Math.random() * totalWeight;
  let acc = 0;
  for(let c of otherCountryWeightList){
    acc += c.weight;
    if(r <= acc){
      return c.name;
    }
  }
  return "中華民國(台灣)";
}

// ======= 抽國籍主函數 =======
function rollNationality(){
  const r = Math.random();
  if(r < 0.65){
    gameState.birth.birthCountry = "中國香港";
  }else if(r < 0.65 + 0.20){
    gameState.birth.birthCountry = "中國";
  }else{
    gameState.birth.birthCountry = rollOtherCountryPool();
  }
  // 鎖定初始國籍，永久不變（隱藏變數）
  gameState.initialNationality = gameState.birth.birthCountry;
}

// ======= 抽香港區同居所 =======
function rollHKResidence(){
  const randDistrict = hkDistrictResidenceList[Math.floor(Math.random() * hkDistrictResidenceList.length)];
  gameState.birth.district = randDistrict.district;
  const randRes = randDistrict.residences[Math.floor(Math.random() * randDistrict.residences.length)];
  gameState.birth.residenceType = randRes.type;
  gameState.birth.residenceName = randRes.name;
}

// ======= 抽全部出生屬性（重新抽按鈕） =======
function rollBirthAttributes(){
  gameState.birth.gender = genderList[Math.floor(Math.random()*genderList.length)];
  gameState.birth.orientation = orientationList[Math.floor(Math.random()*orientationList.length)];
  gameState.birth.familyWealth = wealthList[Math.floor(Math.random()*wealthList.length)];
  rollNationality();
  rollHKResidence();
  gameState.birthLocked = false;
  gameState.age = 0;
}

// ======= 7歲自動轉換當前國籍為香港（initialNationality不變） =======
function autoChangeNationalityToHK(){
  gameState.birth.birthCountry = "中國香港";
}

function renderStory(text){
  $("#storyText").text(text);
}

// ======= 更新標籤面板（只顯示可見資料，唔顯示 initialNationality） =======
function refreshTagDisplay(){
  const g = gameState;
  let locationText = `國籍：${g.birth.birthCountry}`;
  locationText += `\n香港分區：${g.birth.district}\n住所類型：${g.birth.residenceType}\n樓宇名稱：${g.birth.residenceName}`;

  const txt = `【狀態面板】
性別：${trans.gender[g.birth.gender]}
性取向：${trans.orientation[g.birth.orientation]}
家庭經濟：${trans.familyWealth[g.birth.familyWealth]}
${locationText}

性格屬性
外向：${g.trait.outgoing}｜務實：${g.trait.pragmatic}｜同理心：${g.trait.empathy}｜內向：${g.trait.introvert}

狀態
學業水平：${trans.studyLevel[g.stats.studyLevel]}
財務：${trans.finance[g.stats.finance]}
角色歲數：${g.age}
出生屬性已鎖定：${g.birthLocked}`;
  $("#tagInfo").text(txt);
}

// 隱藏所有選項按鈕

  $("#optB").hide();

}

// ====================== 事件劇本 ======================
// 0歲 嬰兒時期
function runAge0Event(){
  const g = gameState;
  g.flags.babySurvived = true;
  g.age = 0;

  let wealthDesc = "";
  switch(g.birth.familyWealth){
    case "poor":
      wealthDesc = "屋企地方細，環境簡樸，父母要長時間打工先可以維持生計。";
      break;
    case "lowerMiddle":
      wealthDesc = "僅僅夠溫飽，每使一筆錢都要小心計算。";
      break;
    case "middle":
      wealthDesc = "家境普通，衣食唔使憂，但唔可以隨便亂使。";
      break;
    case "upperMiddle":
      wealthDesc = "家庭條件唔錯，生活舒適，有餘錢供你日後讀書。";
      break;
    case "rich":
      wealthDesc = "家境優渥，單位設備齊全，父母有充足時間同資源照顧你。";
      break;
    default:
      wealthDesc = "家境普通，衣食唔使憂。";
  }

  renderStory(`# 0歲 · 嬰兒時期
你於${g.birth.district}，${g.birth.residenceType}「${g.birth.residenceName}」出世。
國籍：${g.birth.birthCountry}

${wealthDesc}
眼前嘅世界朦朦朧朧，只聽到父母同親人嘅聲音圍繞住你。
你仲唔識講說話，淨係會靠喊同笑去表達感受。

日子一日一日咁過，你慢慢開始認得身邊嘅人。
【歲月推進，來到3歲】`);
  refreshTagDisplay();
  setTimeout(()=>runAge3Event(),2000);
}

// 3歲 幼兒時期
function runAge3Event(){
  const g = gameState;
  g.age = 3;
  renderStory(`# 3歲 · 幼兒時期
你已經學識行路同講簡單字句，大多數時間都留係屋企同父母一齊。
今日父母放工返屋企，終於有空陪你。

你會點做？
A｜主動行過去，拉住父母隻手，主動撒嬌一齊玩
B｜安靜坐喺隔離，睇住父母做嘢，唔主動打擾
C｜怕生，如果見到陌生人就即刻匿喺父母身後`);
  refreshTagDisplay();

  $("#optA").text("A｜主動親近父母");
  $("#optB").text("B｜安靜係旁邊觀察");
  $("#optC").text("C｜怕生匿埋");
  $("#optA").show();
  $("#optB").show();
  $("#optC").show();

  $("#optA").off("click").on("click",()=>{
    g.trait.outgoing += 8;
    g.trait.empathy += 5;
    g.flags.familyBond = "close";
    nextStage3A();
  })
  $("#optB").off("click").on("click",()=>{
    g.trait.introvert += 8;
    g.trait.pragmatic +=5;
    g.flags.familyBond = "calm";
    nextStage3B();
  })
  $("#optC").off("click").on("click",()=>{
    g.trait.introvert +=12;
    g.trait.outgoing -=4;
    g.flags.familyBond = "shy";
    nextStage3C();
  })
}

function nextStage3A(){
  hideAllOption();
  const g = gameState;
  renderStory(`你主動撲向父母，拉住佢哋一齊玩。
父母見到咁開心，花好多時間陪你，你同屋企人感情變得非常親密。
【歲月推進，來到6歲，準備入小學】`);
  refreshTagDisplay();
  setTimeout(()=>runAge6Event(),2000);
}

父母覺得你好乖，屋企氣氛平和；但你慢慢習慣唔主動表達自己感受。
【歲月推進，來到6歲，準備入小學】`);
  refreshTagDisplay();
  setTimeout(()=>runAge6Event(),2000);
}

父母知道你比較膽小，會多啲保護你；但你對外人會比較有戒心。
【歲月推進，來到6歲，準備入小學】`);

你出生於${gameState.birth.district}，居於${gameState.birth.residenceType}「${gameState.birth.residenceName}」

所有先天背景由系統隨機生成，你可以無限次重新抽選。
揀到滿意嘅出身之後，點擊【開始人生】。`);
  hideAllOption();
});

  gameState.birthLocked = true;
  hideAllOption();
  runAge0Event();
});
