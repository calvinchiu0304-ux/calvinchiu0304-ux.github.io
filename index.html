// ========== 劇本計時全域參數 ==========
const BASE_WORD_COUNT = 100;    // 基準字數
const BASE_SECONDS = 5;         // 基準秒數（100字對應5秒）
const MIN_WAIT_SEC = 3;         // 最少等待時間
const MAX_WAIT_SEC = 30;        // 最長等待上限
let scriptTimer = null;
let scriptRemainingTime = 0;
let scriptNextCallback = null;

// ========== 劇本等待時間計算函數 ==========
function calcScriptWaitTime(scriptText) {
    // 清除空格、換行，標點會計入字數
    const cleanText = scriptText.replace(/ /g,"").replace(/\n/g,"");
    const totalChars = cleanText.length;
    let rawTime = (totalChars / BASE_WORD_COUNT) * BASE_SECONDS;
    let finalTime = Math.max(MIN_WAIT_SEC, Math.min(rawTime, MAX_WAIT_SEC));
    return parseFloat(finalTime.toFixed(1));
}

// ========== 劇本播放函數（帶倒數 + 跳過按鈕） ==========
// text：劇本文字，nextFunc：倒數完/玩家跳過之後執行嘅函數
function showScriptWithTimer(text, nextFunc) {
    clearChoices();
    renderStory(text);
    scriptNextCallback = nextFunc;
    scriptRemainingTime = calcScriptWaitTime(text);

    const skipBtn = document.getElementById("skipScriptBtn");
    const timerText = document.getElementById("scriptTimerText");
    skipBtn.style.display = "block";
    timerText.style.display = "block";
    timerText.innerText = `等待 ${scriptRemainingTime}s`;

    // 清除舊計時器
    if(scriptTimer) clearInterval(scriptTimer);

    scriptTimer = setInterval(()=>{
        scriptRemainingTime -= 0.1;
        if(scriptRemainingTime <= 0){
            finishScriptView();
        }else{
            timerText.innerText = `等待 ${scriptRemainingTime.toFixed(1)}s`;
        }
    },100);
}

// 跳過劇本 / 倒數完結時執行
function finishScriptView(){
    if(scriptTimer) clearInterval(scriptTimer);
    document.getElementById("skipScriptBtn").style.display = "none";
    document.getElementById("scriptTimerText").style.display = "none";
    if(scriptNextCallback){
        const cb = scriptNextCallback;
        scriptNextCallback = null;
        cb();
    }
}

// 綁定跳過按鈕點擊事件
document.getElementById("skipScriptBtn").onclick = function(){
    finishScriptView();
};

// ==========【新增】通用概率抽籤函數 ==========
function rollByProb(probObj){
  const total = Object.values(probObj).reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for(let key in probObj){
    r -= probObj[key];
    if(r <= 0) return key;
  }
}

// =====================【DLC權限檢查函數｜獨立抽離！日後接Firebase只改呢個函數】=====================
/**
 * 檢查玩家是否可以解鎖指定階段
 * @param {string} stageKey 階段代號：childhood / teen / youth / middle / elder
 * @returns {Promise<boolean>} 是否解鎖
 */
async function checkStageUnlock(stageKey){
  const perm = await gameStorage.getUserPermission();
  // 童年永久免費
  if(stageKey === "childhood") return true;

  // 如果玩家未用免費試玩，可以解鎖佢揀嗰個免費階段
  if(!perm.freeTrialUsed && perm.freeTrialStage === stageKey){
    return true;
  }
  // 檢查是否購買咗呢個DLC
  if(perm.ownedDLC.includes(stageKey)){
    return true;
  }
  return false;
}

// 標記玩家已使用免費試玩名額
async function claimFreeTrial(stageKey){
  const perm = await gameStorage.getUserPermission();
  if(perm.freeTrialUsed) return false;
  perm.freeTrialUsed = true;
  perm.freeTrialStage = stageKey;
  await gameStorage.setUserPermission(perm);
  return true;
}

// 模擬購買DLC（原型用，正式版由Firebase後台/收款Webhook修改）
async function addOwnedDLC(dlcKey){
  const perm = await gameStorage.getUserPermission();
  if(!perm.ownedDLC.includes(dlcKey)){
    perm.ownedDLC.push(dlcKey);
  }
  await gameStorage.setUserPermission(perm);
}

// ===== 抽國籍（按權重 65%香港｜20%中國內地｜15%全球池） =====
function rollNationality(){
  const r = Math.random();
  let nation;
  if(r < 0.65){
    nation = "中國香港";
  }else if(r < 0.65 + 0.20){
    nation = "中國內地";
  }else{
    // 進入全球國家加權池抽選
    let totalWeight = 0;
    worldCountryWeightList.forEach(c=>totalWeight += c.weight);
    let rand = Math.random() * totalWeight;
    let acc = 0;
    for(let c of worldCountryWeightList){
      acc += c.weight;
      if(rand <= acc){
        nation = c.name;
        break;
      }
    }
  }
  gameState.birth.birthCountry = nation;
  gameState.initialNationality = nation; // 鎖定隱藏初始國籍，永久唔變
}

// ===== 【修改】根據故事地區，對應到香港18區，再抽居所 =====
function rollHKResidence(storyDistrictName){
  const adminDistrict = storyDistrictToHKAdminDistrict[storyDistrictName];
  const districtObj = hkDistrictResidenceList.find(item=>item.district === adminDistrict);
  const randRes = districtObj.residences[Math.floor(Math.random() * districtObj.residences.length)];
  gameState.birth.residenceType = randRes.type;
  gameState.birth.residenceName = randRes.name;
}

// 【重寫】隨機抽取先天屬性（改用districtData抽地區、家境、origin）
function rollBirthAttributes(){
  // 1. 抽性別、性取向
  gameState.birth.gender = genderList[Math.floor(Math.random()*genderList.length)];
  gameState.birth.orientation = orientationList[Math.floor(Math.random()*orientationList.length)];

  // 2. 抽故事地區
  const districtList = Object.keys(districtData);
  const selectedDistrict = districtList[Math.floor(Math.random()*districtList.length)];
  gameState.birth.district = selectedDistrict;
  const d = districtData[selectedDistrict];

  // 3. 根據地區概率抽 familyWealth 同 origin
  gameState.birth.familyWealth = rollByProb(d.wealthProb);
  gameState.birth.origin = rollByProb(d.originProb);

  //4. 抽國籍
  rollNationality();
  //5. 根據故事地區抽對應居所
  rollHKResidence(selectedDistrict);

  gameState.age = 0;
}

async function loadGame(){

if(saved){

gameState = saved;
}else{
localStorage.removeItem("lifeGameSave");
showStartScreen();
return;
}
}
}catch(e){
console.log("存檔損壞，重置遊戲", e);
localStorage.removeItem("lifeGameSave");

runAge3Event();

}

// 進入管理員模式
function enterAdminMode(){

$("#adminOverlay").style.display = "block";
refreshTagDisplay();
}
// 退出管理員模式
function exitAdminMode(){
isAdminMode = false;
$("#adminOverlay").style.display = "none";
}

// ========== 螢幕點擊序列觸發：上2下3，2.5秒 ==========
const TAP_TIMEOUT = 2500;
let tapPhase = 0; // 0:等待上半 1:等待下半
let tapCount = 0;
let tapTimer = null;

document.addEventListener("click", (e)=>{
// 如果點擊嘅係按鈕，唔計入秘密手勢
if(e.target.classList.contains("choice-btn") || e.target.classList.contains("admin-over-btn")){
return;
}

clearTimeout(tapTimer);
tapTimer = setTimeout(()=>{
tapPhase = 0;
tapCount = 0;
}, TAP_TIMEOUT);

const winHeight = window.innerHeight;
const clickY = e.clientY;
const isUpper = clickY < winHeight / 2;

if(tapPhase === 0){
if(isUpper){
tapCount++;
if(tapCount >= 2){
tapPhase = 1;
tapCount = 0;
}
}
}else if(tapPhase === 1){
if(!isUpper){
tapCount++;
if(tapCount >= 3){
// 完成序列，彈輸入密碼視窗
const pwd = prompt("請輸入管理員密碼");
if(pwd === "calvin"){
enterAdminMode();
}
// 重置點擊序列
tapPhase = 0;
tapCount = 0;
}
}
}
});

}
