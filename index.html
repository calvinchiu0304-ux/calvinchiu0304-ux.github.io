// =====================【DLC權限檢查函數｜獨立抽離！日後接Firebase只改呢個函數】=====================
/**
 * 檢查玩家是否可以解鎖指定階段
 * @param {string} stageKey 階段代號：childhood / teen / youth / middle / elder
 * @returns {Promise<boolean>} 是否解鎖
 */
async function checkStageUnlock(stageKey){
  const perm = await gameStorage.getUserPermission();
  // 童年永久免費
  if(stageKey === "childhood") return true;

  // 如果玩家未用免費試玩，可以解鎖佢揀嗰個免費階段
  if(!perm.freeTrialUsed && perm.freeTrialStage === stageKey){
    return true;
  }
  // 檢查是否購買咗呢個DLC
  if(perm.ownedDLC.includes(stageKey)){
    return true;
  }
  return false;
}

// 標記玩家已使用免費試玩名額
async function claimFreeTrial(stageKey){
  const perm = await gameStorage.getUserPermission();
  if(perm.freeTrialUsed) return false;
  perm.freeTrialUsed = true;
  perm.freeTrialStage = stageKey;
  await gameStorage.setUserPermission(perm);
  return true;
}

// 模擬購買DLC（原型用，正式版由Firebase後台/收款Webhook修改）
async function addOwnedDLC(dlcKey){
  const perm = await gameStorage.getUserPermission();
  if(!perm.ownedDLC.includes(dlcKey)){
    perm.ownedDLC.push(dlcKey);
  }
  await gameStorage.setUserPermission(perm);
}

// ===== 抽國籍（按權重 65%香港｜20%中國內地｜15%全球池） =====
function rollNationality(){
  const r = Math.random();
  let nation;
  if(r < 0.65){
    nation = "中國香港";
  }else if(r < 0.65 + 0.20){
    nation = "中國內地";
  }else{
    // 進入全球國家加權池抽選
    let totalWeight = 0;
    worldCountryWeightList.forEach(c=>totalWeight += c.weight);
    let rand = Math.random() * totalWeight;
    let acc = 0;
    for(let c of worldCountryWeightList){
      acc += c.weight;
      if(rand <= acc){
        nation = c.name;
        break;
      }
    }
  }
  gameState.birth.birthCountry = nation;
  gameState.initialNationality = nation; // 鎖定隱藏初始國籍，永久唔變
}

// ===== 抽香港18區 + 居所（無論任何國籍都一定抽香港居所） =====
function rollHKResidence(){
  const randDistrict = hkDistrictResidenceList[Math.floor(Math.random() * hkDistrictResidenceList.length)];
  gameState.birth.district = randDistrict.district;
  const randRes = randDistrict.residences[Math.floor(Math.random() * randDistrict.residences.length)];
  gameState.birth.residenceType = randRes.type;
  gameState.birth.residenceName = randRes.name;
}

// 隨機抽取先天屬性（重新抽按鈕）
function rollBirthAttributes(){
gameState.birth.gender = genderList[Math.floor(Math.random()*genderList.length)];
gameState.birth.orientation = orientationList[Math.floor(Math.random()*orientationList.length)];
gameState.birth.familyWealth = wealthList[Math.floor(Math.random()*wealthList.length)];
rollNationality();
rollHKResidence();
gameState.age = 0;
}

// ===== 檢查歲數，滿7歲自動將可見國籍改成中國香港，initialNationality唔變 =====
function checkAgeNationalityChange(){
  if(gameState.age >=7 && gameState.birth.birthCountry !== "中國香港"){
    gameState.birth.birthCountry = "中國香港";
  }
}

// 開局畫面
function showStartScreen(){
clearChoices();
gameState.stage = "start";
gameState.birthLocked = false;
rollBirthAttributes();
renderStory(`新的人生即將開始。
國籍：${gameState.birth.birthCountry}｜出生於香港${gameState.birth.district}，居於${gameState.birth.residenceType}「${gameState.birth.residenceName}」

你的出身條件已經隨機生成。
你可以重新抽一次先天設定，或者直接開始成長旅程。`);
addChoice("開始新一局", async ()=>{
gameState.birthLocked = true;
gameState.age = 0;
gameState.eventIndex = 0;
gameState.flags.familyBond = "";
gameState.stage = "age0";
await gameStorage.save(gameState);
runAge0Event();
});
addChoice("重新抽取先天屬性", ()=>{
rollBirthAttributes();
renderStory(`已重新隨機抽取出身設定。
國籍：${gameState.birth.birthCountry}｜出生於香港${gameState.birth.district}，居於${gameState.birth.residenceType}「${gameState.birth.residenceName}」

你可以再次重抽，或者直接開始。`);
refreshTagDisplay();
});
refreshTagDisplay();
}

// ================== 0歲｜嬰兒時期（無選項過場劇，完咗自動去3歲） ==================
function runAge0Event(){
clearChoices();
gameState.stage = "age0";
gameState.age = 0;
checkAgeNationalityChange();

let wealthDesc = "";
switch(gameState.birth.familyWealth){
  case "poor":
    wealthDesc = "屋企單位細，環境簡樸，父母要長時間返工先夠維持生計，照顧你嘅時間有限。";
    break;
  case "middle":
    wealthDesc = "家境普通，衣食無憂，但唔會有太多多餘錢使喺玩樂同興趣上面。";
    break;
  case "rich":
    wealthDesc = "家境優渥，住所設備齊全，父母有充足時間同資源照顧你成長。";
    break;
}

renderStory(`# 0歲 · 嬰兒時期
國籍：${gameState.birth.birthCountry}｜出生於香港${gameState.birth.district}，居於${gameState.birth.residenceType}「${gameState.birth.residenceName}」

${wealthDesc}
你眼中嘅世界淨係得模糊光影，耳邊不停響起父母同親人嘅聲音。
你仲唔識講說話，亦都唔識行，只可以靠喊、扭動身體同淺淺嘅笑容去表達需要同情緒。

時間慢慢流走，幾個月過去，你漸漸認得照顧你嘅人，聽到熟悉聲音就會安靜落來。
【歲月推進，來到3歲】`);
refreshTagDisplay();
// 延時自動跳去3歲事件
setTimeout(()=>{
  gameState.age = 3;
  checkAgeNationalityChange();
  runAge3Event();
},2000);
}

// ================== 3歲｜幼兒時期（第一個可選分支，寫入familyBond旗標） ==================
function runAge3Event(){
clearChoices();
gameState.stage = "age3";
renderStory(`# 3歲 · 幼兒成長
你已經學識穩陣行路，亦都可以講簡單句子。多數時間都留喺屋企，同父母一齊生活。
今日父母放工返屋企，終於有空陪你。

你會點做？
A｜主動行過去，拉住父母隻手，撒嬌邀請佢哋一齊玩
B｜安靜坐喺隔離，靜靜睇父母做家務，唔主動打擾
C｜比較怕生，一旦見到陌生人就即刻匿喺父母身後`);

addChoice("A｜主動親近父母", async ()=>{
  gameState.trait.outgoing = Math.min(100, gameState.trait.outgoing + 8);
  gameState.trait.empathy = Math.min(100, gameState.trait.empathy + 5);
  gameState.flags.familyBond = "close";
  await gameStorage.save(gameState);
  nextAge3A();
});
addChoice("B｜安靜係旁邊觀察", async ()=>{
  gameState.trait.introvert = Math.min(100, gameState.trait.introvert + 8);
  gameState.trait.pragmatic = Math.min(100, gameState.trait.pragmatic + 5);
  gameState.flags.familyBond = "calm";
  await gameStorage.save(gameState);
  nextAge3B();
});
addChoice("C｜怕生匿埋", async ()=>{
  gameState.trait.introvert = Math.min(100, gameState.trait.introvert + 12);
  gameState.trait.outgoing = Math.max(0, gameState.trait.outgoing - 4);
  gameState.flags.familyBond = "shy";
  await gameStorage.save(gameState);
  nextAge3C();
});
refreshTagDisplay();
}

function nextAge3A(){
clearChoices();
renderStory(`你主動撲向父母，拉住佢哋嘅手邀請一齊玩。
父母見到你咁活潑，好開心，願意花好多時間陪伴你，你同屋企建立起非常親密嘅感情。
【歲月推進，來到6歲，準備入小學】`);
refreshTagDisplay();
setTimeout(()=>{
  gameState.age = 6;
  checkAgeNationalityChange();
  // 日後呢度會接上 runAge6Event()
  runNextChildhoodEvent();
},2000);
}
function nextAge3B(){
clearChoices();
renderStory(`你靜靜坐喺隔離睇父母做家務，唔會騷擾佢哋。
父母都覺得你好乖，屋企氣氛平和；但你慢慢習慣唔主動講出自己諗法同感受。
【歲月推進，來到6歲，準備入小學】`);
refreshTagDisplay();
setTimeout(()=>{
  gameState.age = 6;
  checkAgeNationalityChange();
  runNextChildhoodEvent();
},2000);
}
function nextAge3C(){
clearChoices();
renderStory(`一旦有陌生人上門，你即刻匿喺父母身後，唔肯出聲。
父母知道你比較膽小，會多啲保護你；但面對外人，你會本能地存有戒心。
【歲月推進，來到6歲，準備入小學】`);
refreshTagDisplay();
setTimeout(()=>{
  gameState.age = 6;
  checkAgeNationalityChange();
  runNextChildhoodEvent();
},2000);
}

// 執行童年微型事件（6歲開始嘅童年事件庫）
function runNextChildhoodEvent(){
clearChoices();
let idx = gameState.eventIndex;
if(idx >= childhoodEvents.length){
showAge15FinalChoices();
return;
}
let evt = childhoodEvents[idx];
renderStory(evt.text);
evt.choices.forEach(ch=>{
addChoice(ch.text, async ()=>{
for(let key in ch.delta){
gameState.trait[key] = Math.max(0, Math.min(100, gameState.trait[key] + ch.delta[key]));
}
gameState.eventIndex++;
await gameStorage.save(gameState);
runNextChildhoodEvent();
})
})
refreshTagDisplay();
}

// 15歲，最終三大顯性選擇
function showAge15FinalChoices(){
gameState.stage = "age15Choice";
clearChoices();
renderStory("你已經15歲。\n回望成長歲月，你需要選擇接下來主要投入嘅方向：");
finalAge15Choices.forEach(opt=>{
addChoice(opt.text, async ()=>{
opt.effect();
await gameStorage.save(gameState);
renderStory("你做出咗選擇。第1階段完結，即將進入19歲｜風雲初起。\n【這裡之後可以寫跳轉到Stage2劇本】");
clearChoices();
refreshTagDisplay();
})
})
refreshTagDisplay();
}

// 載入存檔（改用新抽象層）
async function loadGame(){
try{
let saved = await gameStorage.load();
if(saved){
if(saved.birth && saved.trait && saved.stats && saved.stage !== undefined){
gameState = saved;
}else{
localStorage.removeItem("lifeGameSave");
showStartScreen();
return;
}
}
}catch(e){
console.log("存檔損壞，重置遊戲", e);
localStorage.removeItem("lifeGameSave");
}

checkAgeNationalityChange();
switch(gameState.stage){
case "start":
showStartScreen();
break;
case "age0":
runAge0Event();
break;
case "age3":
runAge3Event();
break;
case "childhoodEvent":
runNextChildhoodEvent();
break;
case "age15Choice":
showAge15FinalChoices();
break;
default:
showStartScreen();
}
refreshTagDisplay();
}

// ========== 管理員模式功能 ==========
// 開啟劇情跳轉選單
function openJumpMenu(){
let menuText = "請選擇要跳轉嘅劇情分支：\n";
jumpList.forEach((item,i)=>{
menuText += `${i+1}. ${item.name}\n`;
})
let input = prompt(menuText + "\n輸入數字：");
let num = parseInt(input);
if(!isNaN(num) && num >=1 && num <= jumpList.length){
jumpList[num-1].fn();
}
}

// 進入管理員模式
function enterAdminMode(){
isAdminMode = true;
$("#adminOverlay").style.display = "block";
refreshTagDisplay();
}
// 退出管理員模式
function exitAdminMode(){
isAdminMode = false;
$("#adminOverlay").style.display = "none";
}

// ========== 螢幕點擊序列觸發：上2下3，2.5秒 ==========
const TAP_TIMEOUT = 2500;
let tapPhase = 0; // 0:等待上半 1:等待下半
let tapCount = 0;
let tapTimer = null;

document.addEventListener("click", (e)=>{
// 如果點擊嘅係按鈕，唔計入秘密手勢
if(e.target.classList.contains("choice-btn") || e.target.classList.contains("admin-over-btn")){
return;
}

clearTimeout(tapTimer);
tapTimer = setTimeout(()=>{
tapPhase = 0;
tapCount = 0;
}, TAP_TIMEOUT);

const winHeight = window.innerHeight;
const clickY = e.clientY;
const isUpper = clickY < winHeight / 2;

if(tapPhase === 0){
if(isUpper){
tapCount++;
if(tapCount >= 2){
tapPhase = 1;
tapCount = 0;
}
}
}else if(tapPhase === 1){
if(!isUpper){
tapCount++;
if(tapCount >= 3){
// 完成序列，彈輸入密碼視窗
const pwd = prompt("請輸入管理員密碼");
if(pwd === "calvin"){
enterAdminMode();
}
// 重置點擊序列
tapPhase = 0;
tapCount = 0;
}
}
}
});

// 快速跳轉函數
function jumpToAge0(){
gameState.stage="age0";
gameState.age=0;
gameState.birthLocked=true;
runAge0Event();
}
function jumpToAge3(){
gameState.stage="age3";
gameState.age=3;
gameState.birthLocked=true;
runAge3Event();
}
function jumpToChildhood(){
gameState.stage="childhoodEvent";
gameState.eventIndex=0;
gameState.age=6;
gameState.birthLocked=true;
checkAgeNationalityChange();
runNextChildhoodEvent();
}
function jumpToAge15(){
gameState.stage="age15Choice";
showAge15FinalChoices();
}

// 開局載入
loadGame();
</script>
