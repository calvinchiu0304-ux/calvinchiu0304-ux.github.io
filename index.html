<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現實人生｜香港人生之旅</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}

/* 全局背景圖設置 */
body{
  background:#111 url('Hk1.jpg') no-repeat center center fixed;
  background-size:cover;
  color:#eee;
  padding:24px;
  max-width:800px;
  margin:0 auto;
  line-height:1.6;
  position:relative;
  min-height:100vh;
}

/* 遊戲內容器增加半透明背景遮罩，確保文字與圖表清晰 */
#container{
  background:rgba(34, 34, 34, 0.92);
  backdrop-filter: blur(8px);
  padding:24px;
  border-radius:12px;
  min-height:400px;
  display:none; /* 開局預設隱藏，待點擊開始遊戲後淡入 */
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  opacity: 0;
  transition: opacity 1s ease;
}

/* ===== 開場封面 / 遊戲霓虹燈效層 ===== */
#titleCover{
  position:fixed;
  top:0; left:0; width:100vw; height:100vh;
  background:#0b0f19 url('Hk1.jpg') no-repeat center center;
  background-size:cover;
  z-index:2000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition: opacity 1.5s ease-in-out;
}

/* 封面暗色深藍色調遮罩，營造夜間霓虹氛圍 */
#titleCover::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle, rgba(11,15,25,0.7) 0%, rgba(5,8,15,0.92) 100%);
  z-index: -1;
}

/* 標題外包裝群組 */
.title-group {
  text-align: center;
  margin-bottom: 40px;
  padding: 0 20px;
}

/* 上方大標題「香港」：藍紅雙色霓虹燈設計（外框電光藍、內層桃紅發光）[span_2](start_span)[span_2](end_span) */
#gameTitle{
  font-size: 80px;
  font-weight: 900;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
  color: #fff;
  text-shadow: 
    0 0 5px #ff2a6d, 
    0 0 15px #ff2a6d, 
    0 0 30px #05d9e8, 
    0 0 60px #05d9e8,
    0 0 100px #05d9e8;
  letter-spacing: 16px;
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 1.2s ease, transform 1.2s ease;
  margin-left: 16px;
}

/* 下方副標題「--你的人生之旅--」：藍色霓虹光暈 */
#gameSubTitle{
  font-size: 18px;
  font-weight: 600;
  color: #e0fbfc;
  letter-spacing: 6px;
  margin-top: 18px;
  text-shadow: 0 0 6px #05d9e8, 0 0 15px #05d9e8, 0 2px 5px rgba(0,0,0,0.9);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1.2s ease 0.4s, transform 1.2s ease 0.4s;
}

/* 最下方閃爍的霓虹文字框與「開始遊戲」按鈕[span_3](start_span)[span_3](end_span) */
@keyframes neonPulse {
  0%, 100% {
    border-color: #05d9e8;
    box-shadow: 0 0 10px #05d9e8, inset 0 0 10px #05d9e8, 0 0 30px rgba(5,217,232,0.4);
  }
  50% {
    border-color: #ff2a6d;
    box-shadow: 0 0 20px #ff2a6d, inset 0 0 15px #ff2a6d, 0 0 50px rgba(255,42,109,0.7);
  }
}
