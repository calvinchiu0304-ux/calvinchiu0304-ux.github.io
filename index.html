<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字冒險遊戲</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}

body{
  /* 預設：深色背景，冇圖片 */
  background: #181818;
  min-height: 100vh;
  color:#fff;
  padding:16px;
  line-height:1.6
}

/* 專門給開頭場景用的背景樣式（BB圖） */
body.start-bg{
  background: url("baby.jpg") no-repeat center center;
  background-size: cover;
}

#container{
  max-width:700px;
  margin:0 auto;
  padding-top:30px;
}

#story{
  font-size:18px;
  margin-bottom:24px;
  background-color: rgba(20,20,20,0.55);
  backdrop-filter: blur(4px);
  border-radius:16px;
  padding:20px;
  text-shadow: 0 1px 3px #000;
}

.choice{
  display:block;
  width:100%;
  padding:14px;
  margin:8px 0;
  background:rgba(20,20,20,0.6);
  backdrop-filter: blur(4px);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;
  border-radius:16px;
  font-size:16px;
  text-align:left;
  text-shadow: 0 1px 3px #000;
}
.choice:active{background:rgba(40,40,40,0.7)}
</style>
</head>
<body>
<div id="container">
  <div id="story"></div>
  <div id="choices"></div>
</div>
<script>
const gameData = {
  start:{
    text:"新的人生即將開始。你的出身條件已經隨機生成。你可以重新抽一次先天設定，或者直接開始成長旅程。",
    choices:[
      {text:"開始新一局",next:"doorLeft"},
      {text:"重新抽取先天屬性",next:"start"}
    ]
  },
  doorLeft:{
    text:"木門推開，入面係一間廚房，枱上擺住一把舊鎅刀。",
    choices:[
      {text:"拿起鎅刀",next:"getKnife"},
      {text:"返出去大廳",next:"start"}
    ]
  },
  getKnife:{
    text:"你攞起鎅刀，感覺安心咗少少。廚房窗戶外面黑漆漆。",
    choices:[
      {text:"離開廚房返大廳",next:"start"}
    ]
  },
  stairsRight:{
    text:"你沿樓梯向上行，樓上有一道鎖住嘅房門。",
    choices:[
      {text:"試下推門",next:"lockedDoor"},
      {text:"返落樓",next:"start"}
    ]
  },
  lockedDoor:{
    text:"門鎖實咗，推唔開，需要搵方法開鎖。",
    choices:[
      {text:"返落樓搵工具",next:"start"}
    ]
  }
};

const storyEl = document.getElementById("story");
const choicesEl = document.getElementById("choices");
const bodyEl = document.body;

function render(sceneId){
  const scene = gameData[sceneId];
  storyEl.textContent = scene.text;
  choicesEl.innerHTML = "";

  // 判斷：只有 start 場景先加BB背景
  if(sceneId === "start"){
    bodyEl.classList.add("start-bg");
  }else{
    bodyEl.classList.remove("start-bg");
  }

  scene.choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.className="choice";
    btn.textContent = c.text;
    btn.onclick = ()=>render(c.next);
    choicesEl.appendChild(btn);
  })
}
render("start");
</script>
</body>
</html>
