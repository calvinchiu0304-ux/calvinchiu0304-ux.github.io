function rollByProb(probObj){
  const total = Object.values(probObj).reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for(let key in probObj){
    r -= probObj[key];
    if(r <= 0) return key;
  }
}

function generateBirthBackground(gameState){
  const {district, familyWealth, origin} = gameState.birth;
  let originText = "";
  switch(origin){
    case "localHK": originText = "土生土長香港家庭"; break;
    case "uk": originText = "英國背景回流家庭"; break;
    case "sg": originText = "新加坡背景家庭"; break;
    case "cnMainland": originText = "內地新移民家庭"; break;
    case "southAsia": originText = "南亞裔家庭"; break;
    case "others": originText = "其他海外背景家庭"; break;
  }

  let wealthDesc = "";
  if(familyWealth === "rich"){
    if(district === "半山區" || district === "九龍塘"){
      wealthDesc = "優質物業價值極高，父母係跨國高管、老牌家族比例較多。普遍資源充足，私人補習、海外遊學機會高；但多數父母工作極忙，陪伴時間少。";
    }else if(district === "西貢"){
      wealthDesc = "自置鄉村屋居多，家人普遍為經營生意或者專業人士。居住空間大，環境寧靜；生活節奏比較放鬆，但國際人脈較少。";
    }else if(district === "深水埗"){
      wealthDesc = "舊區本土小型地產商、批發生意人。家族有物業收租比例較多，習慣留喺舊區生活，生活作風低調；熟悉社區網絡，街坊關係良好。";
    }else{
      wealthDesc = "家庭經濟條件良好，生活穩定，有能力負擔唔少課外開支。";
    }
  }
  else if(familyWealth === "middle"){
    if(district === "沙田" || district === "將軍澳"){
      wealthDesc = "典型香港打工中產比例較多。通常擁有私樓/居屋，父母多數為文職、教師、護士等。收入穩定，平均儲蓄比例中上，多數家庭重視學業，期望仔女讀好大學。";
    }else if(district === "灣仔"){
      wealthDesc = "普遍舊樓細單位，收入尚可，但租金/生活開支高。生活喺市中心，見識多，接觸好多不同國籍嘅人。";
    }else if(district === "西貢"){
      wealthDesc = "多數鄉村家庭，可能做小生意或者散工多，居住空間大，但交通唔方便。";
    }else{
      wealthDesc = "家境普通，衣食無憂，不過冇太多多餘金錢用喺昂貴課外活動。";
    }
  }
  else if(familyWealth === "poor"){
    if(district === "半山區"){
      wealthDesc = "特例困境：祖上留低半山舊大宅，物業天價，上一代因為童年太富裕，生活揮霍，痛失學習成長或商業機會，開支過大，導致現金收入微薄。維修、差餉開支沉重，「有樓冇錢」。外表係豪宅，實際生活拮據。";
    }else{
      wealthDesc = "公屋或者細舊唐樓，普遍父母工作為藍領、散工，通常收入比較唔穩定。有時要面對房租壓力、生活開支壓力。資源有限，補習、課外活動有可能係奢侈品。";
    }
  }

  return `【出身背景】
居住地：${district}
家庭背景：${originText}
${wealthDesc}`;

// 輔助函式：安全增加/減少 OCEAN 數值 (限制 0-100)
function updateOcean(deltaObj){
  for(let key in deltaObj){
    if(gameState.ocean[key] !== undefined){
      gameState.ocean[key] = Math.max(0, Math.min(100, gameState.ocean[key] + deltaObj[key]));
    }
  }
  drawOceanRadar(); // 自動重繪五角形雷達圖
}

// ===================== 【大五人格 (OCEAN) 初始值計算邏輯】 =====================
function initOceanAttributes(){
  const g = gameState;
  let baseAgeVal = 0;
  
  if(g.age === 0) baseAgeVal = 0;
  else if(g.age <= 15) baseAgeVal = 35;
  else if(g.age <= 30) baseAgeVal = 55;
  else baseAgeVal = 70;

  g.ocean = {
    openness: baseAgeVal,
    conscientiousness: baseAgeVal,
    extraversion: baseAgeVal,
    agreeableness: baseAgeVal,
    neuroticism: baseAgeVal
  };

  const district = g.birth.district;
  const wealth = g.birth.familyWealth;
  const origin = g.birth.origin;

  if(wealth === "poor" || district === "深水埗" || district === "元朗舊墟"){
    g.ocean.neuroticism += 12;
  } else if(district === "半山區" && wealth === "rich"){
    g.ocean.neuroticism += 8;
  }

  if(district === "灣仔" || district === "九龍塘" || district === "半山區" || origin === "uk" || origin === "sg"){
    g.ocean.openness += 12;
  }

  if(district === "深水埗" || district === "觀塘"){
    g.ocean.agreeableness += 6;
  }

  for(let k in g.ocean){
    g.ocean[k] = Math.max(0, Math.min(100, g.ocean[k]));
  }

  drawOceanRadar();
}

// ===================== 【HTML5 Canvas 五角形雷達圖繪製】 =====================
function drawOceanRadar(){
  const canvas = document.getElementById("oceanCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const width = canvas.width;
  const height = canvas.height;
  const centerX = width / 2;
  const centerY = height / 2 + 10;
  const radius = 80;

  ctx.clearRect(0, 0, width, height);

  const labels = [
    { name: "開放性 (O)", key: "openness" },
    { name: "盡責性 (C)", key: "conscientiousness" },
    { name: "外向性 (E)", key: "extraversion" },
    { name: "宜人性 (A)", key: "agreeableness" },
    { name: "神經質 (N)", key: "neuroticism" }
  ];

  const total = labels.length;
  const angleStep = (Math.PI * 2) / total;

  ctx.strokeStyle = "#444";
  ctx.lineWidth = 1;
  for(let level = 1; level <= 5; level++){
    const r = (radius / 5) * level;
    ctx.beginPath();
    for(let i = 0; i < total; i++){
      const angle = i * angleStep - Math.PI / 2;
      const x = centerX + r * Math.cos(angle);
      const y = centerY + r * Math.sin(angle);
      if(i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  ctx.fillStyle = "#bbb";
  ctx.font = "12px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for(let i = 0; i < total; i++){
    const angle = i * angleStep - Math.PI / 2;
    const x = centerX + radius * Math.cos(angle);
    const y = centerY + radius * Math.sin(angle);

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#333";
    ctx.stroke();

    const labelX = centerX + (radius + 24) * Math.cos(angle);
    const labelY = centerY + (radius + 18) * Math.sin(angle);
    const val = gameState.ocean[labels[i].key] || 0;
    ctx.fillText(`${labels[i].name}:${Math.round(val)}`, labelX, labelY);
  }

  ctx.beginPath();
  for(let i = 0; i < total; i++){
    const angle = i * angleStep - Math.PI / 2;
    const val = gameState.ocean[labels[i].key] || 0;
    const currentR = (val / 100) * radius;
    const x = centerX + currentR * Math.cos(angle);
    const y = centerY + currentR * Math.sin(angle);
    if(i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(255, 193, 7, 0.35)";
  ctx.fill();
  ctx.strokeStyle = "#ffc107";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function playSequentialStory(fullText, onComplete, showSkipBtn = true){
  clearTimeouts();
  clearChoices();

  let rawSentences = fullText.split(/([。！？\n])/);
  let sentences = [];
  let currentSentence = "";
  
  for(let i=0; i<rawSentences.length; i++){
    currentSentence += rawSentences[i];
    if(/[。！？\n]/.test(rawSentences[i]) || i === rawSentences.length - 1){
      if(currentSentence.trim().length > 0){
        sentences.push(currentSentence.trim());
      }
      currentSentence = "";
    }
  }

  let index = 0;
  const storyEl = $("#story");

  if(showSkipBtn){
    const skipBtn = document.createElement("button");
    skipBtn.className = "skip-btn";
    skipBtn.innerText = "⏭️ 跳過劇本";
    skipBtn.onclick = function(){
      clearTimeouts();
      onComplete();
    }
    $("#choices").appendChild(skipBtn);
  }

  function playNextSentence(){
    if(index >= sentences.length){
      currentTimeout = setTimeout(()=>{
        onComplete();
      }, 800);
      return;
    }

    let textToType = sentences[index];
    index++;
    storyEl.innerText = "";
    storyEl.style.opacity = 1;

    let charIdx = 0;
    currentInterval = setInterval(()=>{
      if(charIdx < textToType.length){
        storyEl.innerText += textToType.charAt(charIdx);
        charIdx++;
      }else{
        clearInterval(currentInterval);
        let readWaitTime = Math.max(1800, textToType.length * 110);
        currentTimeout = setTimeout(()=>{
          storyEl.style.opacity = 0;
          currentTimeout = setTimeout(()=>{
            playNextSentence();
          }, 300);
        }, readWaitTime);
      }
    }, 35);
  }

  playNextSentence();
  refreshTagDisplay();
}

function rollNationality(){
  const r = Math.random();
  let nation;
  if(r < 0.65){ nation = "中國香港"; }
  else if(r < 0.85){ nation = "中國內地"; }
  else {
    let totalWeight = 0;
    worldCountryWeightList.forEach(c=>totalWeight += c.weight);
    let rand = Math.random() * totalWeight;
    let acc = 0;
    for(let c of worldCountryWeightList){
      acc += c.weight;
      if(rand <= acc){ nation = c.name; break; }
    }
  }
  gameState.birth.birthCountry = nation;
  gameState.initialNationality = nation;
}

function rollHKResidence(storyDistrictName){
  const adminDistrict = storyDistrictToHKAdminDistrict[storyDistrictName];
  const districtObj = hkDistrictResidenceList.find(item=>item.district === adminDistrict);
  const randRes = districtObj.residences[Math.floor(Math.random() * districtObj.residences.length)];
  gameState.birth.residenceType = randRes.type;
  gameState.birth.residenceName = randRes.name;
}

function rollBirthAttributes(){
  gameState.birth.gender = ["male","female"][Math.floor(Math.random()*2)];
  gameState.birth.orientation = ["hetero","homo","bi","pan","asexual"][Math.floor(Math.random()*5)];

  const districtList = Object.keys(districtData);
  const selectedDistrict = districtList[Math.floor(Math.random()*districtList.length)];
  gameState.birth.district = selectedDistrict;
  const d = districtData[selectedDistrict];

  gameState.birth.familyWealth = rollByProb(d.wealthProb);
  gameState.birth.origin = rollByProb(d.originProb);

  rollNationality();
  rollHKResidence(selectedDistrict);
  gameState.age = 0;
  
  initOceanAttributes();
}

      {text:"覺得分數唔係一切，繼續做自己鍾意嘅事", delta:{openness:+6, conscientiousness:-4}}
    ]}
  ];

  if(idx >= childhoodList.length){
    showAge15FinalChoices();
    return;
  }

  let evt = childhoodList[idx];
  
  playSequentialStory(evt.text, ()=>{
    clearChoices();
    evt.choices.forEach(ch=>{
      addChoice(ch.text, async ()=>{
        updateOcean(ch.delta);
        gameState.eventIndex++;
        await gameStorage.save(gameState);
        runNextChildhoodEvent();
      });
    });
  }, false);
}

async function loadGame(){
  try{
    let saved = await gameStorage.load();
    if(saved){
      if(saved.birth && saved.stage !== undefined){
        gameState = saved;
      }else{
        localStorage.removeItem("lifeGameSave");
        showStartScreen();
        return;
      }
    }
  }catch(e){
    localStorage.removeItem("lifeGameSave");
  }

  checkAgeNationalityChange();
  if(!gameState.ocean) initOceanAttributes();
  drawOceanRadar();
  
  switch(gameState.stage){
    case "start": showStartScreen(); break;
    case "prologue": runPrologue(); break;
    case "age0_spring": runAge0Spring(); break;
    case "age0_summer": runAge0Summer(); break;
    case "age0_autumn": runAge0Autumn(); break;
    case "age0_winter": runAge0Winter(); break;
    case "age1_spring": runAge1Spring(); break;
    case "age1_summer": runAge1Summer(); break;
    case "age1_autumn": runAge1Autumn(); break;
    case "age1_winter": runAge1Winter(); break;
    case "age2_spring": runAge2Spring(); break;
    case "age2_summer": runAge2Summer(); break;
    case "age2_autumn": runAge2Autumn(); break;
    case "age2_winter": runAge2Winter(); break;
    case "age3_spring": runAge3Spring(); break;
    case "age3_summer": runAge3Summer(); break;
    case "age3_autumn": runAge3Autumn(); break;
    case "age3_winter": runAge3Winter(); break;
    case "childhoodEvent": runNextChildhoodEvent(); break;
    case "age15Choice": showAge15FinalChoices(); break;
    default: showStartScreen();
  }
  refreshTagDisplay();
}

function openJumpMenu(){
  let menuText = "請選擇要跳轉嘅劇情分支：\n";
  jumpList.forEach((item,i)=>{ menuText += `${i+1}. ${item.name}\n`; });
  let input = prompt(menuText + "\n輸入數字：");
  let num = parseInt(input);
  if(!isNaN(num) && num >= 1 && num <= jumpList.length){
    jumpList[num-1].fn();
  }
}

function enterAdminMode(){
  isAdminMode = true;
  $("#adminOverlay").style.display = "block";
  refreshTagDisplay();
}
function exitAdminMode(){
  isAdminMode = false;
  $("#adminOverlay").style.display = "none";
}

const TAP_TIMEOUT = 2500;
let tapPhase = 0;
let tapCount = 0;
let tapTimer = null;

document.addEventListener("click", (e)=>{
  if(e.target.classList.contains("choice-btn") || e.target.classList.contains("admin-over-btn") || e.target.classList.contains("skip-btn")){
    return;
  }

  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{
    tapPhase = 0;
    tapCount = 0;
  }, TAP_TIMEOUT);

  const winHeight = window.innerHeight;
  const clickY = e.clientY;
  const isUpper = clickY < winHeight / 2;

  if(tapPhase === 0){
    if(isUpper){
      tapCount++;
      if(tapCount >= 2){ tapPhase = 1; tapCount = 0; }
    }
  }else if(tapPhase === 1){
    if(!isUpper){
      tapCount++;
      if(tapCount >= 3){
        const pwd = prompt("請輸入管理員密碼");
        if(pwd === "calvin"){ enterAdminMode(); }
        tapPhase = 0; tapCount = 0;
      }
    }
  }
});

loadGame();
</script>
</body>
